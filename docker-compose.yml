services:
  api:
    build: .
    container_name: django_web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend_react
    container_name: react_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend_react:/app
      - /app/node_modules
    networks:
      - app_network

  flask_service:
    build:
      context: ./flask_service
    container_name: flask_notifications
    ports:
      - "5000:5000"
    networks:
      - app_network

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - flask_service
    networks:
      - app_network

networks:
  app_network:
    driver: bridge