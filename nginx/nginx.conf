server {
    listen 80;

    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # =========================================================================
    # Strangler Pattern — Microservicio Flask (notificaciones)
    # Las rutas /flask/ van al nuevo microservicio independiente
    # =========================================================================
    location /flask/ {
        proxy_pass http://flask_service:5000/;
    }

    # Ruta legacy explícita de notificaciones (compatibilidad)
    location /api/v2/notificaciones/ {
        proxy_pass http://flask_service:5000/notificaciones/;
    }

    # =========================================================================
    # Monolito Django — API Gateway
    # =========================================================================
    location /api/v1/ {
        proxy_pass http://api:8000/api/;
    }

    location /api/ {
        proxy_pass http://api:8000;
    }

    # =========================================================================
    # Frontend React — con soporte WebSocket para HMR de Vite
    # =========================================================================
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
