server {
    listen 80;

    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;

    # Microservicio estrangulado (Flask) — Strangler Pattern
    # Las rutas /api/v2/notificaciones/ van al nuevo microservicio Flask
    location /api/v2/notificaciones/ {
        proxy_pass http://flask_service:5000/notificaciones/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Monolito legacy (Django) — rutas /api/v1/ proxiadas a /api/ en Django
    location /api/v1/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Acceso directo al monolito (compatibilidad con frontend en desarrollo)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend React
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
